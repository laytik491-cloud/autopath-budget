<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><rect width="900" height="700" fill="white"/><text x="50" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">Навигация MVP 1.0.0</text><rect x="50" y="110" width="800" height="150" rx="10" fill="#f6f6f6" stroke="#999" stroke-width="2"/><text x="70" y="147" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111">Поездка</text><text x="70" y="187" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">По карте: А → Б → Построить маршрут</text><text x="70" y="221" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">По расстоянию: выбрать режим → ввести километры</text><text x="70" y="255" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Результат виден на том же экране</text><path d="M250 260v75M650 260v75" fill="none" stroke="#666" stroke-width="3"/><rect x="50" y="335" width="380" height="190" rx="10" fill="#f6f6f6" stroke="#999" stroke-width="2"/><text x="70" y="372" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111">Расчёт</text><text x="70" y="412" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Литры и стоимость</text><text x="70" y="446" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Доля, формула, источник</text><text x="70" y="480" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Изменить поездку</text><text x="70" y="514" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Очистить с подтверждением</text><rect x="470" y="335" width="380" height="190" rx="10" fill="#f6f6f6" stroke="#999" stroke-width="2"/><text x="490" y="372" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111">Справка</text><text x="490" y="412" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Два способа расчёта</text><text x="490" y="446" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Параметры и ограничения</text><text x="490" y="480" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Сохранение и сеть</text><text x="490" y="514" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">Запуск — в README</text><text x="50" y="600" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111">Ошибки относятся к полям или операции.</text><text x="50" y="640" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111">Последний корректный расчёт сохраняется автоматически.</text></svg>